# =============================================================================
# Docker Compose - Orchestrates the Ambient Scribe stack
# =============================================================================
#
# Run with: docker compose up --build
#
# SERVICES:
#
#   nemo-agent  - Python FastAPI + NeMo GPU inference (WebSocket + HTTP)
#   app         - PHP Symfony web application (UI + session management)
#   mercure     - Real-time SSE hub for transcript streaming
#   ollama      - CPU-only role/summary LLM (profile `ollama`; skipped on Bedrock)
#
# DATA FLOW:
#
#   Browser ──(WebSocket audio)──► nemo-agent (NeMo GPU)
#                                       │
#                                       ├──(publish segments)──► mercure ──(SSE)──► Browser
#                                       │
#   Browser ──(HTTP)──► app (PHP) ──(HTTP)──► nemo-agent (session history)
#
# PORTS:
#   http://localhost:48082  - Scribe UI (PHP app)
#   http://localhost:48101  - NeMo agent API (for debugging)
#   http://localhost:48137  - Mercure hub (for SSE subscriptions)
#
# GPU REQUIREMENT:
#   The nemo-agent service requires an NVIDIA GPU with the NVIDIA Container
#   Toolkit installed. See: https://docs.nvidia.com/datacenter/cloud-native/
# =============================================================================

services:
  # ===========================================================================
  # NEMO-AGENT - Python FastAPI + NeMo GPU Inference
  # ===========================================================================
  # Handles:
  #   - WebSocket audio streaming (/ws/transcribe/{session_id})
  #   - NeMo multitalker Parakeet transcription (GPU-bound)
  #   - Batch file transcription (/transcribe/file)
  #   - Mercure publishing (raw segments + role updates)
  #
  # GPU models are loaded once at startup and shared across sessions.
  # NeMo inference runs in a ThreadPoolExecutor to avoid blocking the
  # async event loop.
  nemo-agent:
    build:
      context: ./strands_agents
      dockerfile: ../docker/nemo/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${AGENT_PORT:-48101}:8000"
    environment:
      # --- NeMo configuration ---
      - NEMO_MODEL_PROVIDER=${NEMO_MODEL_PROVIDER:-local}
      - NEMO_STREAM_INPUT_FORMAT=${NEMO_STREAM_INPUT_FORMAT:-pcm}
      - NEMO_MAX_WORKERS=${NEMO_MAX_WORKERS:-2}
      - NEMO_BUFFER_MAX_DURATION=${NEMO_BUFFER_MAX_DURATION:-900}
      - NEMO_SPEAKER_CAP=${NEMO_SPEAKER_CAP:-2}
      - NEMO_SESSION_ENGINE=${NEMO_SESSION_ENGINE:-windowed}
      # Off by default; named QA replays log only speaker IDs, counts, shares, and timings.
      - NEMO_STREAMING_SLOT_EVIDENCE=${NEMO_STREAMING_SLOT_EVIDENCE:-0}
      # Off by default; measured QA replays can keep sustained voices out of a dominant row.
      - NEMO_STREAMING_CROSSTALK_GUARD=${NEMO_STREAMING_CROSSTALK_GUARD:-0}
      - MAX_SESSIONS=${MAX_SESSIONS:-100}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-7200}
      - SESSION_STORAGE=${SESSION_STORAGE:-memory}
      - SESSION_DB_PATH=${SESSION_DB_PATH:-/data/sessions.db}
      - LOG_FORMAT=${LOG_FORMAT:-json}

      # --- Mercure publishing ---
      - MERCURE_HUB_URL=http://mercure:3701/.well-known/mercure
      - MERCURE_JWT=${MERCURE_PUBLISHER_JWT:-}
      - MERCURE_JWT_SECRET=${MERCURE_JWT_SECRET:-ambient-scribe-mercure-dev-secret-key}

      # --- Role inference agent (uses Bedrock by default, Ollama optional) ---
      - ROLE_AGENT_MODEL_PROVIDER=${ROLE_AGENT_MODEL_PROVIDER:-ollama}
      - ROLE_AGENT_MODEL_ID=${ROLE_AGENT_MODEL_ID:-us.anthropic.claude-sonnet-4-20250514-v1:0}
      - ROLE_AGENT_OLLAMA_MODEL=${ROLE_AGENT_OLLAMA_MODEL:-qwen3.5:9b}
      # Pinned to the bundled `ollama` service (container-to-container). This is NOT
      # overridable by .env on purpose: `host.docker.internal` is unreachable from the
      # agent container on some Docker/WSL2 setups, and a stale .env value silently
      # broke role inference + summaries. Use Bedrock instead via ROLE_AGENT_MODEL_PROVIDER.
      - OLLAMA_HOST=http://ollama:11434
      - MEDICAL_BOOST_ENABLED=${MEDICAL_BOOST_ENABLED:-1}
      - MEDICAL_LEXICON_PATH=${MEDICAL_LEXICON_PATH:-/app/data/medical_lexicon.txt}

      # --- AWS credentials (for Bedrock role inference) ---
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-2}
    command: ["uvicorn", "api.server:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--ws", "websockets-sansio"]
    volumes:
      - ./strands_agents:/app  # Hot reload in dev
      - session_data:/data     # Persistent SQLite session storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      # Ollama only runs under the `ollama` compose profile; Bedrock setups
      # start without it, so the dependency must not be required.
      ollama:
        condition: service_started
        required: false
    healthcheck:
      # /health returns 200 (ok) when models loaded or skipped, 503 (degraded)
      # when model loading failed. 503 will cause Docker to mark unhealthy.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s  # NeMo model loading takes time

  # ===========================================================================
  # APP - PHP Symfony Web Application
  # ===========================================================================
  # Serves the transcript UI and provides session management.
  # Does NOT touch the live audio hot path.
  #
  # Flow: Browser → GET /scribe → Twig template with session config
  #       Browser → GET /scribe/{id}/history → transcript retrieval
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-48082}:8080"
    volumes:
      - .:/app  # Hot reload in dev - source changes reflected immediately
    environment:
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-ambient-scribe-dev-secret-change-me}
      - AGENT_ENDPOINT=http://nemo-agent:8000
      - NEMO_WEBSOCKET_URL=ws://localhost:${AGENT_PORT:-48101}
      - MERCURE_URL=http://mercure:3701/.well-known/mercure
      - MERCURE_PUBLIC_URL=http://localhost:${MERCURE_PORT:-48137}/.well-known/mercure
      - MERCURE_JWT_SECRET=${MERCURE_JWT_SECRET:-ambient-scribe-mercure-dev-secret-key}
    depends_on:
      nemo-agent:
        condition: service_healthy
      mercure:
        condition: service_started

  # ===========================================================================
  # MERCURE - Real-time SSE Hub
  # ===========================================================================
  # Relays transcript segments from the Python agent to the browser.
  #
  # Topics:
  #   scribe/session/{id}/raw    - Raw spk_0/spk_1 segments (immediate)
  #   scribe/session/{id}/roles  - DOCTOR/PATIENT role updates (async)
  mercure:
    image: dunglas/mercure
    ports:
      - "${MERCURE_PORT:-48137}:3701"
    environment:
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-ambient-scribe-mercure-dev-secret-key}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-ambient-scribe-mercure-dev-secret-key}
      SERVER_NAME: ":3701"
      # Keep dev CORS scoped to the local app by default. If you need a wider
      # setting for short-lived debugging, override MERCURE_CORS_ORIGINS.
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cors_origins ${MERCURE_CORS_ORIGINS:-http://localhost:48082}

  # ===========================================================================
  # OLLAMA - Local LLM for Role Inference + Summaries (CPU-only)
  # ===========================================================================
  # Runs only under the `ollama` compose profile, for setups where
  # ROLE_AGENT_MODEL_PROVIDER=ollama. Bedrock setups never start this service.
  # start-dev.sh activates the profile automatically; by hand:
  #   COMPOSE_PROFILES=ollama docker compose up -d
  # nemo-agent reaches it in-network at http://ollama:11434. No host port is
  # published, so it never clashes with a host-side Ollama already on 11434.
  # The GPU belongs to NeMo - Ollama runs on CPU using system RAM.
  #
  # First run only - pull the model into the persistent ollama_data volume:
  #   docker compose exec ollama ollama pull qwen3.5:9b
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0

volumes:
  session_data:
  ollama_data:
