version: "1.16.0"

skills:
  install: all

# Hook toggles for goat-flow-shipped hooks.
# Togglable goat-flow hook state. Missing entries use registry defaults.
# Agent writers install only lifecycle events supported by each runner.
# Manage with the dashboard Hooks page or `goat-flow hooks <enable|disable|sync>`.
hooks:
  deny-dangerous:
    enabled: true
  gruff-code-quality:
    enabled: true
  post-turn-safety:
    enabled: true
