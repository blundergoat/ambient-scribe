name: Context Validation

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - '.claude/**'
      - '**/CLAUDE.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CLAUDE.md line count
        run: |
          LINES=$(wc -l < CLAUDE.md)
          echo "CLAUDE.md: $LINES lines"
          if [ "$LINES" -gt 150 ]; then
            echo "::error::CLAUDE.md is $LINES lines — MUST be under 150"
            exit 1
          elif [ "$LINES" -gt 120 ]; then
            echo "::warning::CLAUDE.md is $LINES lines — target is under 120 for apps"
          fi

      - name: Router table references exist
        run: |
          ERRORS=0
          # Check key referenced paths from router table
          for path in \
            docs/domain-reference.md \
            docs/architecture.md \
            docs/lessons.md \
            docs/footguns.md \
            docs/confusion-log.md \
            tasks/handoff-template.md \
            .github/instructions/ai-agent-guidelines.instructions.md; do
            if [ ! -f "$path" ]; then
              echo "::error::Router table references $path but file does not exist"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

      - name: Skills directories have SKILL.md
        run: |
          ERRORS=0
          for dir in .claude/skills/*/; do
            if [ ! -f "${dir}SKILL.md" ]; then
              echo "::error::Skill directory $dir is missing SKILL.md"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

      - name: Local CLAUDE.md files under 20 lines
        run: |
          ERRORS=0
          find . -name "CLAUDE.md" -not -path "./CLAUDE.md" -not -path "./vendor/*" -not -path "./.git/*" | while read -r f; do
            LINES=$(wc -l < "$f")
            if [ "$LINES" -gt 20 ]; then
              echo "::error::$f is $LINES lines — local CLAUDE.md files MUST be under 20 lines"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi
