name: Context Validation

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/CLAUDE.md'
      - 'docs/codex-playbooks/**'
      - 'docs/architecture.md'
      - 'docs/domain-reference.md'
      - 'docs/footguns.md'
      - 'docs/lessons.md'
      - 'docs/confusion-log.md'
      - 'docs/guidelines-ownership-split.md'
      - 'agent-evals/**'
      - 'tasks/handoff-template.md'
      - 'tasks/todo.md'
      - 'scripts/context-validate.sh'
      - 'scripts/deny-dangerous.sh'
      - '.github/instructions/**'
      - '.github/workflows/context-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AGENTS.md line count
        run: |
          LINES=$(wc -l < AGENTS.md)
          echo "AGENTS.md: $LINES lines"
          if [ "$LINES" -gt 150 ]; then
            echo "::error::AGENTS.md is $LINES lines — hard limit is 150"
            exit 1
          elif [ "$LINES" -gt 135 ]; then
            echo "::warning::AGENTS.md is $LINES lines — target is under 135"
          fi

      - name: Context validation script
        run: ./scripts/context-validate.sh

      - name: Local instruction files under 20 lines
        run: |
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            LINES=$(wc -l < "$f")
            if [ "$LINES" -gt 20 ]; then
              echo "::error::$f is $LINES lines — local instruction files MUST stay under 20 lines"
              exit 1
            fi
          done < <(find . \( -name "CLAUDE.md" -o -name "AGENTS.md" \) \
            -not -path "./CLAUDE.md" \
            -not -path "./AGENTS.md" \
            -not -path "./vendor/*" \
            -not -path "./.git/*" \
            | sort)
