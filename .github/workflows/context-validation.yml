name: Context Validation

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/CLAUDE.md'
      - 'docs/architecture.md'
      - 'docs/domain-reference.md'
      - '.goat-flow/**'
      - 'docs/guidelines-ownership-split.md'
      - 'tasks/handoff-template.md'
      - 'scripts/context-validate.sh'
      - '.goat-flow/hooks/deny-dangerous.sh'
      - '.github/instructions/**'
      - '.github/workflows/context-validation.yml'
      - '.github/git-commit-instructions.md'
      - 'ai/**'
      - '.claude/skills/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: AGENTS.md line count
        run: |
          LINES=$(wc -l < AGENTS.md)
          echo "AGENTS.md: $LINES lines"
          if [ "$LINES" -gt 150 ]; then
            echo "::error::AGENTS.md is $LINES lines - hard limit is 150"
            exit 1
          elif [ "$LINES" -gt 135 ]; then
            echo "::warning::AGENTS.md is $LINES lines - target is under 135"
          fi

      - name: Context validation script
        run: ./scripts/context-validate.sh

      - name: Local instruction files under 20 lines
        run: |
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            LINES=$(wc -l < "$f")
            if [ "$LINES" -gt 20 ]; then
              echo "::error::$f is $LINES lines - local instruction files MUST stay under 20 lines"
              exit 1
            fi
          done < <(find . \( -name "CLAUDE.md" -o -name "AGENTS.md" \) \
            -not -path "./CLAUDE.md" \
            -not -path "./AGENTS.md" \
            -not -path "./vendor/*" \
            -not -path "./.git/*" \
            | sort)

      - name: Router table targets exist
        run: |
          FAIL=0
          while IFS='|' read -r _ resource _ ; do
            # Extract backtick-wrapped path(s) from the Resource column
            paths="$(echo "$resource" | grep -oP '`[^`]+`' | sed 's/`//g' || true)"
            [ -z "$paths" ] && continue
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              # Skip glob patterns (e.g., docs/domain-*.md)
              [[ "$path" == *"*"* ]] && continue
              # Strip trailing slash for directory checks
              clean="${path%/}"
              if [ ! -e "$clean" ] && [ ! -d "$path" ]; then
                echo "::error::Router target missing: $path"
                FAIL=1
              fi
            done <<< "$paths"
          done < <(sed -n '/^## Router/,/^## /p' CLAUDE.md | grep '^|' | tail -n +3)
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "Router targets: OK"

      - name: Skills directories have SKILL.md
        run: |
          FAIL=0
          for skill_dir in .claude/skills/goat-*/; do
            [ -d "$skill_dir" ] || continue
            if [ ! -f "${skill_dir}SKILL.md" ]; then
              echo "::error::Missing SKILL.md in $skill_dir"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          SKILL_COUNT=$(find .claude/skills -maxdepth 1 -type d -name 'goat-*' | wc -l | tr -d ' ')
          if [ "$SKILL_COUNT" -lt 1 ]; then
            echo "::error::No skills found in .claude/skills/goat-*/"
            exit 1
          fi
          echo "Skills check: $SKILL_COUNT skills found, all have SKILL.md"
